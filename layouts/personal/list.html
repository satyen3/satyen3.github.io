{{- define "main" }}
{{- $root := site.GetPage "/personal" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  {{- if .Content }}
  <div class="post-content md-content">
    {{ .Content }}
  </div>
  {{- end }}

  <nav class="notes-browser notes-browser-full" aria-label="Notes">
    {{- partial "personal/tree.html" (dict "dir" "personal/" "pages" $root.RegularPagesRecursive "page" . "openAll" true) }}
  </nav>
</article>

{{- end }}{{/* end main */}}
