baseURL = "https://satyen3.github.io/"
languageCode = "en-us"
title = "Satyen Patel"
theme = "PaperMod"
# README of the private notes repo is not a note.
ignoreFiles = ['personal[/\\]README\.md$']

[params]
  DateFormat = "January 2, 2006"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  defaultTheme = "light"
  disableThemeToggle = true
  ShowToc = false
  math = true
  hideSummary = true

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [['$$', '$$'], ['\\[', '\\]']]
  inline = [['$', '$'], ['\\(', '\\)']]

[[menu.main]]
  identifier = "research"
  name = "Research"
  url = "/research/"
  weight = 10

[[menu.main]]
  identifier = "notes"
  name = "Notes"
  url = "/notes/"
  weight = 20

#[[menu.main]]
#  identifier = "reading"
#  name = "Reading"
#  weight = 30
#  url = "/reading/"

[[menu.main]]
  identifier = "essays"
  name = "Writings"
  weight = 40
  url = "/essays/"

[[menu.main]]
  identifier = "cv"
  name = "CV"
  url = "/cv.pdf"
  weight = 50

# Personal notes (content/personal, a clone of the private satyen3/personal-notes
# repo). Hidden: no menu entry, noindex, no sitemap/RSS, left out of site-wide
# listings. The deploy workflow encrypts everything under /personal/.

[[cascade]]
  outputs = ['html']
  [cascade.target]
    path = '{/personal,/personal/**}'
  [cascade.build]
    list = 'local'
  [cascade.sitemap]
    disable = true
  [cascade.params]
    robotsNoIndex = true
    hideMeta = true
    ShowPostNavLinks = false
    math = true
